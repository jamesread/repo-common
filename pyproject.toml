[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-helper"
version = "0.1.0"
description = "CLI utilities for repo-common: health checks and screenshots"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "configargparse",
    "Pillow",
    "PyYAML",
    "selenium",
    "webdriver-manager",
]

[project.scripts]
repo-helper = "repo_helper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repo_helper*"]
